<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#AEB99A">

<title>Craft Crafterina - Gift Hamper Price List</title>

<style>

:root{
  --sage:#AEB99A;
  --sage-dark:#7D8B69;
  --sage-deep:#657354;
  --cream:#F7F5ED;
  --cream-light:#FBFAF5;
  --white:#FFFFFF;
  --text:#4D5443;
  --text-light:#777D6D;
  --line:#DEE3D4;
  --danger:#B66B63;
  --shadow:0 6px 24px rgba(70,80,55,.09);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--cream);
  color:var(--text);
}

button,
input{
  font:inherit;
}

.header{
  background:var(--sage);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.logo{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:50%;
  object-fit:cover;
  background:#fff;
  border:3px solid rgba(255,255,255,.9);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.brand-text{
  min-width:0;
}

.brand-title{
  color:#fff;
  font-size:21px;
  line-height:1.2;
  font-weight:750;
}

.brand-subtitle{
  color:rgba(255,255,255,.9);
  font-size:13px;
  margin-top:3px;
}

.reset-btn{
  flex-shrink:0;
  border:0;
  background:#fff;
  color:var(--sage-deep);
  padding:14px 22px;
  min-width:100px;
  min-height:48px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  font-weight:750;
}

.container{
  width:min(1120px,100%);
  margin:0 auto;
  padding:24px 16px 40px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.card{
  min-width:0;
  background:var(--white);
  border:1px solid rgba(222,227,212,.7);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow);
}

.card-title{
  color:var(--sage-deep);
  font-size:20px;
  font-weight:750;
  margin-bottom:20px;
}

.section-title{
  color:var(--text);
  font-size:14px;
  font-weight:750;
  margin:22px 0 10px;
}

label{
  display:block;
  color:var(--text);
  font-size:12px;
  font-weight:650;
  margin-bottom:6px;
}

input{
  width:100%;
  min-width:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--cream-light);
  color:var(--text);
  padding:10px 11px;
  outline:none;
}

input:focus{
  border-color:var(--sage-dark);
  box-shadow:0 0 0 3px rgba(125,139,105,.12);
}

input::placeholder{
  color:#A2A69A;
}

.item-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.item-row{
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--cream-light);
  padding:11px;
}

.item-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px 36px;
  gap:8px;
  align-items:center;
}

.item-name-wrap{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
}

.emoji{
  width:25px;
  flex:0 0 25px;
  text-align:center;
  font-size:18px;
}

.name-input{
  min-width:0;
}

.price-input{
  text-align:right;
}

.delete-btn{
  width:36px;
  height:38px;
  border:0;
  border-radius:8px;
  background:#F0F1ED;
  color:#8A8F82;
  cursor:pointer;
  font-size:20px;
  line-height:1;
}

.delete-btn:hover{
  background:#F3E8E6;
  color:var(--danger);
}

.chocolate-submenu{
  margin-top:10px;
  padding:12px;
  background:#EEF1E7;
  border:1px solid #E0E5D7;
  border-radius:10px;
}

.chocolate-subtitle{
  color:var(--sage-deep);
  font-size:11px;
  font-weight:750;
  margin-bottom:9px;
  text-transform:uppercase;
  letter-spacing:.3px;
}

.chocolate-entry{
  margin-bottom:10px;
}

.chocolate-entry:last-of-type{
  margin-bottom:0;
}

.chocolate-fields{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px 105px 36px;
  gap:8px;
  align-items:end;
}

.field-label{
  font-size:10px;
  color:var(--text-light);
  margin-bottom:4px;
}

.qty-input{
  text-align:center;
}

.unit-price-input{
  text-align:right;
}

.remove-chocolate-btn{
  width:36px;
  height:38px;
  border:0;
  border-radius:8px;
  background:#F0F1ED;
  color:#8A8F82;
  cursor:pointer;
  font-size:18px;
  line-height:1;
}

.remove-chocolate-btn:hover{
  background:#F3E8E6;
  color:var(--danger);
}

.add-chocolate-btn{
  width:100%;
  margin-top:10px;
  padding:9px;
  border:1px dashed var(--sage-dark);
  border-radius:8px;
  background:#F5F7F1;
  color:var(--sage-deep);
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.add-chocolate-btn:hover{
  background:#EEF2E8;
}

.add-btn{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:1px dashed var(--sage-dark);
  border-radius:9px;
  background:#F5F7F1;
  color:var(--sage-deep);
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.add-btn:hover{
  background:#EEF2E8;
}

.delivery-section{
  margin-top:22px;
}

.delivery-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px;
  gap:10px;
  align-items:center;
}

.delivery-row label{
  margin:0;
  font-size:13px;
  font-weight:600;
}

.delivery-input{
  text-align:right;
}

.preview-box{
  width:100%;
  min-height:360px;
  padding:17px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#F4F5EF;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
  line-height:1.6;
}

.total-box{
  margin-top:14px;
  padding:15px 16px;
  background:var(--sage);
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.total-label{
  font-size:14px;
  font-weight:650;
}

.total-amount{
  font-size:20px;
  font-weight:800;
}

.copy-btn{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:var(--sage-dark);
  color:#fff;
  padding:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:750;
}

.copy-btn:hover{
  background:var(--sage-deep);
}

@media(max-width:820px){

  .container{
    grid-template-columns:1fr;
  }

}

@media(max-width:560px){

  .header{
    padding:13px 14px;
  }

  .logo{
    width:50px;
    height:50px;
    flex-basis:50px;
  }

  .brand-title{
    font-size:18px;
  }

  .brand-subtitle{
    font-size:12px;
  }

  .reset-btn{
    padding:13px 18px;
    min-width:96px;
    min-height:46px;
    font-size:14px;
  }

  .container{
    padding:15px 11px 30px;
    gap:15px;
  }

  .card{
    padding:16px;
    border-radius:14px;
  }

  .card-title{
    font-size:18px;
    margin-bottom:17px;
  }

  .item-main{
    grid-template-columns:minmax(0,1fr) 82px 35px;
    gap:6px;
  }

  .chocolate-fields{
    grid-template-columns:minmax(0,1fr) 65px 88px 35px;
    gap:6px;
  }

  .delivery-row{
    grid-template-columns:minmax(0,1fr) 90px;
    gap:8px;
  }

  .delivery-row label{
    font-size:12px;
  }

  .preview-box{
    min-height:300px;
    font-size:13px;
  }

}

@media(max-width:380px){

  .brand-subtitle{
    display:none;
  }

  .brand-title{
    font-size:17px;
  }

  .reset-btn{
    padding:12px 15px;
    min-width:90px;
    min-height:44px;
  }

  .item-main{
    grid-template-columns:minmax(0,1fr) 75px 34px;
  }

  .chocolate-fields{
    grid-template-columns:minmax(0,1fr) 58px 78px 34px;
  }

}

</style>
</head>

</header>


<main class="container">


<section class="card">

  <div class="card-title">
    Build Your Hamper
  </div>


  <label for="hamperName">
    Hamper Name
  </label>


  <input
    id="hamperName"
    type="text"
    placeholder="Enter hamper name"
    oninput="updatePreview()"
  >


  <div class="section-title">
    Gift Items
  </div>


  <div
    id="items"
    class="item-list"
  ></div>


  <button
    class="add-btn"
    type="button"
    onclick="addItem()"
  >
    + Add Item
  </button>


  <div class="section-title delivery-section">
    Doorstep Delivery
  </div>


  <div class="delivery-row">

    <label>
      🚚 Delivery
    </label>


    <input
      id="delivery"
      class="delivery-input"
      type="number"
      inputmode="decimal"
      min="0"
      value="260"
      oninput="updatePreview()"
    >

  </div>

</section>


<section class="card">

  <div class="card-title">
    Customer Preview
  </div>


  <div
    id="preview"
    class="preview-box"
  ></div>


  <div class="total-box">

    <span class="total-label">
      Total
    </span>


    <span
      id="totalAmount"
      class="total-amount"
    >
      ₹0
    </span>

  </div>


  <button
    class="copy-btn"
    type="button"
    onclick="copyPreview()"
  >
    Copy Price List
  </button>

</section>

</main>



<script>

/* =========================================
   FIXED GIFT PREPARATION CHARGES
========================================= */

const PREPARATION_CHARGES = [

  {
    emoji:"🎀",
    name:"Wrapping & Decoration",
    amount:120
  },

  {
    emoji:"🧺",
    name:"Hamper Arrangement",
    amount:100
  },

  {
    emoji:"🛒",
    name:"Items Sourcing",
    amount:80
  },

  {
    emoji:"🪄",
    name:"Personalization",
    amount:80
  }

];


const FIXED_PREPARATION_TOTAL =
  PREPARATION_CHARGES.reduce(
    (sum, charge) =>
      sum + charge.amount,
    0
  );


/* =========================================
   DEFAULT ITEMS
========================================= */

const defaultItems = [

  {
    name:"Mini Photo Frame",
    price:""
  },

  {
    name:"Box",
    price:""
  },

  {
    name:"Chocolates",
    chocolate:true,
    chocolates:[
      {
        brand:"",
        qty:1,
        unitPrice:""
      }
    ]
  },

  {
    name:"Nail Polish",
    price:""
  },

  {
    name:"Flowers",
    price:""
  },

  {
    name:"Wish Card",
    price:""
  }

];


let itemCounter = 0;


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   EMOJI
========================================= */

function getEmoji(name){

  const value =
    String(name || "").toLowerCase();


  if(value.includes("chocolate"))
    return "🍫";


  if(value.includes("flower"))
    return "🌸";


  if(value.includes("box"))
    return "🎁";


  if(value.includes("photo"))
    return "🖼️";


  if(value.includes("nail"))
    return "💅";


  if(value.includes("card"))
    return "💌";


  if(value.includes("cake"))
    return "🎂";


  if(value.includes("teddy"))
    return "🧸";


  if(value.includes("perfume"))
    return "🌸";


  return "🎁";

}


/* =========================================
   CHOCOLATE SUBMENU
========================================= */

function createChocolateSubmenu(item={}){

  const chocolates =
    item.chocolates && item.chocolates.length
    ? item.chocolates
    : [
        {
          brand:item.brand || "",
          qty:item.qty || 1,
          unitPrice:item.unitPrice ?? item.price ?? ""
        }
      ];


  return `

    <div class="chocolate-submenu">

      <div class="chocolate-subtitle">
        Chocolate Details
      </div>


      <div class="chocolate-entries">

        ${chocolates.map((chocolate) => `

          <div class="chocolate-entry">

            <div class="chocolate-fields">

              <div>

                <div class="field-label">
                  Brand / Type
                </div>


                <input
                  class="brand-input"
                  type="text"
                  value="${escapeHtml(chocolate.brand || "")}"
                  placeholder="e.g. Dairy Milk"
                  oninput="updatePreview()"
                >

              </div>


              <div>

                <div class="field-label">
                  Quantity
                </div>


                <input
                  class="qty-input"
                  type="number"
                  inputmode="numeric"
                  min="1"
                  value="${
                    Number(chocolate.qty) > 0
                    ? Number(chocolate.qty)
                    : 1
                  }"
                  oninput="updatePreview()"
                >

              </div>


              <div>

                <div class="field-label">
                  Unit Price
                </div>


                <input
                  class="unit-price-input"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  value="${escapeHtml(
                    chocolate.unitPrice ?? ""
                  )}"
                  placeholder="₹"
                  oninput="updatePreview()"
                >

              </div>


              <button
                class="remove-chocolate-btn"
                type="button"
                aria-label="Remove chocolate"
                onclick="removeChocolate(this)"
              >
                ×
              </button>

            </div>

          </div>

        `).join("")}

      </div>


      <button
        class="add-chocolate-btn"
        type="button"
        onclick="addChocolate(this)"
      >
        + Add Chocolate
      </button>

    </div>

  `;

}


/* =========================================
   ADD CHOCOLATE
========================================= */

function addChocolate(button){

  const submenu =
    button.closest(
      ".chocolate-submenu"
    );


  if(!submenu) return;


  const entries =
    submenu.querySelector(
      ".chocolate-entries"
    );


  const entry =
    document.createElement("div");


  entry.className =
    "chocolate-entry";


  entry.innerHTML = `

    <div class="chocolate-fields">

      <div>

        <div class="field-label">
          Brand / Type
        </div>


        <input
          class="brand-input"
          type="text"
          value=""
          placeholder="e.g. Dairy Milk"
          oninput="updatePreview()"
        >

      </div>


      <div>

        <div class="field-label">
          Quantity
        </div>


        <input
          class="qty-input"
          type="number"
          inputmode="numeric"
          min="1"
          value="1"
          oninput="updatePreview()"
        >

      </div>


      <div>

        <div class="field-label">
          Unit Price
        </div>


        <input
          class="unit-price-input"
          type="number"
          inputmode="decimal"
          min="0"
          value=""
          placeholder="₹"
          oninput="updatePreview()"
        >

      </div>


      <button
        class="remove-chocolate-btn"
        type="button"
        aria-label="Remove chocolate"
        onclick="removeChocolate(this)"
      >
        ×
      </button>

    </div>

  `;


  entries.appendChild(entry);


  updatePreview();

}


/* =========================================
   REMOVE CHOCOLATE
========================================= */

function removeChocolate(button){

  const submenu =
    button.closest(
      ".chocolate-submenu"
    );


  const entry =
    button.closest(
      ".chocolate-entry"
    );


  if(!submenu || !entry) return;


  const entries =
    submenu.querySelectorAll(
      ".chocolate-entry"
    );


  if(entries.length <= 1){

    entry.querySelector(
      ".brand-input"
    ).value = "";

    entry.querySelector(
      ".qty-input"
    ).value = 1;

    entry.querySelector(
      ".unit-price-input"
    ).value = "";

  }else{

    entry.remove();

  }


  updatePreview();

}


/* =========================================
   ADD ITEM
========================================= */

function addItem(data=null){

  const item = data || {

    name:"",
    price:"",
    chocolate:false,
    chocolates:[
      {
        brand:"",
        qty:1,
        unitPrice:""
      }
    ]

  };


  const id =
    itemCounter++;


  const row =
    document.createElement("div");


  row.className =
    "item-row";


  row.dataset.id =
    id;


  const isChocolate =
    item.chocolate === true ||
    String(item.name || "")
      .toLowerCase()
      .includes("chocolate");


  row.innerHTML = `

    <div class="item-main">


      <div class="item-name-wrap">

        <span class="emoji">
          ${getEmoji(item.name)}
        </span>


        <input
          class="name-input"
          type="text"
          value="${escapeHtml(item.name)}"
          placeholder="Item name"
          oninput="itemChanged(${id})"
        >

      </div>


      ${
        isChocolate
        ? ""

        :

        `
        <input
          class="price-input"
          type="number"
          inputmode="decimal"
          min="0"
          value="${escapeHtml(item.price)}"
          placeholder="Price"
          oninput="updatePreview()"
        >
        `
      }


      <button
        class="delete-btn"
        type="button"
        aria-label="Remove item"
        onclick="removeItem(${id})"
      >
        ×
      </button>


    </div>


    ${
      isChocolate
      ? createChocolateSubmenu(item)
      : ""
    }

  `;


  document
    .getElementById("items")
    .appendChild(row);


  updatePreview();

}


/* =========================================
   ITEM NAME CHANGE
========================================= */

function itemChanged(id){

  const row =
    document.querySelector(
      `.item-row[data-id="${id}"]`
    );


  if(!row) return;


  const nameInput =
    row.querySelector(
      ".name-input"
    );


  const name =
    nameInput.value.trim();


  const isChocolate =
    name
      .toLowerCase()
      .includes("chocolate");


  const submenu =
    row.querySelector(
      ".chocolate-submenu"
    );


  const main =
    row.querySelector(
      ".item-main"
    );


  if(isChocolate && !submenu){

    const price =
      row.querySelector(
        ".price-input"
      )?.value || "";


    const wrapper =
      document.createElement("div");


    wrapper.innerHTML =
      createChocolateSubmenu({

        chocolates:[
          {
            brand:"",
            qty:1,
            unitPrice:price
          }
        ]

      });


    row.appendChild(
      wrapper.firstElementChild
    );


    const priceInput =
      row.querySelector(
        ".price-input"
      );


    if(priceInput){
      priceInput.remove();
    }

  }


  if(!isChocolate && submenu){

    const unitPrice =
      row.querySelector(
        ".unit-price-input"
      )?.value || "";


    submenu.remove();


    const priceInput =
      document.createElement("input");


    priceInput.className =
      "price-input";


    priceInput.type =
      "number";


    priceInput.inputMode =
      "decimal";


    priceInput.min =
      "0";


    priceInput.value =
      unitPrice;


    priceInput.placeholder =
      "Price";


    priceInput.addEventListener(
      "input",
      updatePreview
    );


    main.insertBefore(
      priceInput,
      row.querySelector(
        ".delete-btn"
      )
    );

  }


  const emoji =
    row.querySelector(
      ".emoji"
    );


  if(emoji){

    emoji.textContent =
      getEmoji(name);

  }


  updatePreview();

}


/* =========================================
   REMOVE ITEM
========================================= */

function removeItem(id){

  const row =
    document.querySelector(
      `.item-row[data-id="${id}"]`
    );


  if(row){
    row.remove();
  }


  updatePreview();

}


/* =========================================
   GET ITEMS
========================================= */

function getItems(){

  const rows =
    document.querySelectorAll(
      ".item-row"
    );


  const items = [];


  rows.forEach(row => {

    const nameInput =
      row.querySelector(
        ".name-input"
      );


    if(!nameInput) return;


    const name =
      nameInput.value.trim();


    if(!name) return;


    const submenu =
      row.querySelector(
        ".chocolate-submenu"
      );


    if(submenu){

      const chocolateEntries =
        submenu.querySelectorAll(
          ".chocolate-entry"
        );


      chocolateEntries.forEach(
        entry => {

          const brand =
            entry.querySelector(
              ".brand-input"
            )?.value.trim() || "";


          const qtyValue =
            Number(
              entry.querySelector(
                ".qty-input"
              )?.value
            );


          const qty =
            qtyValue > 0
            ? qtyValue
            : 1;


          const unitPrice =
            Number(
              entry.querySelector(
                ".unit-price-input"
              )?.value
            ) || 0;


          items.push({

            name:name,

            chocolate:true,

            brand:brand,

            qty:qty,

            unitPrice:unitPrice,

            total:
              qty * unitPrice

          });

        }
      );


    }else{

      const price =
        Number(
          row.querySelector(
            ".price-input"
          )?.value
        ) || 0;


      items.push({

        name:name,

        chocolate:false,

        price:price,

        total:price

      });

    }

  });


  return items;

}


/* =========================================
   MONEY
========================================= */

function formatMoney(value){

  return Number(
    value || 0
  ).toLocaleString(
    "en-IN"
  );

}


/* =========================================
   PREVIEW
========================================= */

function updatePreview(){

  const hamperName =
    document
      .getElementById("hamperName")
      .value
      .trim()
    || "Gift Hamper";


  const items =
    getItems();


  let giftItemsTotal = 0;


  let message =
    `🎁 *${hamperName}*\n\n`;


  message +=
    `*Gift Items*\n`;


  if(items.length === 0){

    message +=
      `No items added\n`;

  }else{

    items.forEach(item => {

      giftItemsTotal +=
        item.total;


      if(item.chocolate){

        let line =
          `${getEmoji(item.name)} ${item.name}`;


        if(item.brand){

          line +=
            ` — ${item.brand}`;

        }


        line +=
          ` × ${item.qty} — ₹${formatMoney(item.total)}`;


        message +=
          line + "\n";


      }else{

        message +=
          `${getEmoji(item.name)} ${item.name} — ₹${formatMoney(item.total)}\n`;

      }

    });

  }


  /* GIFT ITEMS TOTAL */

  message +=
    `\n*Gift Items Total — ₹${formatMoney(giftItemsTotal)}*\n\n`;


  /* GIFT PREPARATION */

  message +=
    `✨ *Gift Preparation*\n`;


  PREPARATION_CHARGES.forEach(
    charge => {

      message +=
        `${charge.emoji} ${charge.name} — ₹${formatMoney(charge.amount)}\n`;

    }
  );


  message +=
    `\n🧰 Gift Preparation Total — ₹${formatMoney(FIXED_PREPARATION_TOTAL)}\n`;


  /* DELIVERY */

  const delivery =
    Number(
      document.getElementById(
        "delivery"
      ).value
    ) || 0;


  message +=
    `🚚 Doorstep Delivery — ₹${formatMoney(delivery)}\n`;


  /* FINAL TOTAL */

  const total =
    giftItemsTotal +
    FIXED_PREPARATION_TOTAL +
    delivery;


  message +=
    `\n━━━━━━━━━━━━━━━━\n`;


  message +=
    `💰 *TOTAL — ₹${formatMoney(total)}*`;


  document
    .getElementById(
      "preview"
    )
    .textContent =
    message;


  document
    .getElementById(
      "totalAmount"
    )
    .textContent =
    `₹${formatMoney(total)}`;

}


/* =========================================
   COPY
========================================= */

async function copyPreview(){

  const text =
    document
      .getElementById(
        "preview"
      )
      .textContent;


  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch(error){

    const temp =
      document.createElement(
        "textarea"
      );


    temp.value =
      text;


    temp.style.position =
      "fixed";


    temp.style.opacity =
      "0";


    document.body.appendChild(
      temp
    );


    temp.select();


    document.execCommand(
      "copy"
    );


    temp.remove();

  }


  const button =
    document.querySelector(
      ".copy-btn"
    );


  const original =
    button.textContent;


  button.textContent =
    "✓ Copied!";


  setTimeout(() => {

    button.textContent =
      original;

  },1500);

}


/* =========================================
   RESET
========================================= */

function resetApp(){

  if(
    !confirm(
      "Reset the price list?"
    )
  ) return;


  document
    .getElementById(
      "hamperName"
    )
    .value = "";


  document
    .getElementById(
      "delivery"
    )
    .value = 260;


  document
    .getElementById(
      "items"
    )
    .innerHTML = "";


  itemCounter = 0;


  defaultItems.forEach(
    item =>
      addItem({
        ...item
      })
  );


  updatePreview();

}


/* =========================================
   INITIALIZE
========================================= */

defaultItems.forEach(
  item =>
    addItem({
      ...item
    })
);


updatePreview();

</script>

</body>
</html>
