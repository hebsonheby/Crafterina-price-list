<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#AEB99A">
<title>Craft Crafterina - Gift Hamper Price List</title>

<style>
:root{
  --sage:#AEB99A; --sage-dark:#7D8B69; --sage-deep:#657354;
  --cream:#F7F5ED; --cream-light:#FBFAF5; --white:#FFFFFF;
  --text:#4D5443; --text-light:#777D6D; --line:#DEE3D4;
  --danger:#B66B63; --shadow:0 6px 24px rgba(70,80,55,.09);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--cream);
  color:var(--text)
}
button,input{font:inherit}
.header{
  background:var(--sage);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0
}
.logo{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:50%;
  object-fit:cover;
  background:#fff;
  border:3px solid rgba(255,255,255,.9);
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.brand-text{min-width:0}
.brand-title{
  color:#fff;
  font-size:21px;
  line-height:1.2;
  font-weight:750
}
.brand-subtitle{
  color:rgba(255,255,255,.9);
  font-size:13px;
  margin-top:3px
}
.reset-btn{
  flex-shrink:0;
  border:0;
  background:#fff;
  color:var(--sage-deep);
  padding:14px 22px;
  min-width:100px;
  min-height:48px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  font-weight:750
}
.container{
  width:min(1120px,100%);
  margin:0 auto;
  padding:24px 16px 40px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:22px;
  align-items:start
}
.card{
  min-width:0;
  background:var(--white);
  border:1px solid rgba(222,227,212,.7);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow)
}
.card-title{
  color:var(--sage-deep);
  font-size:20px;
  font-weight:750;
  margin-bottom:20px
}
.section-title{
  color:var(--text);
  font-size:14px;
  font-weight:750;
  margin:22px 0 10px
}
label{
  display:block;
  color:var(--text);
  font-size:12px;
  font-weight:650;
  margin-bottom:6px
}
input{
  width:100%;
  min-width:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--cream-light);
  color:var(--text);
  padding:10px 11px;
  outline:none
}
input:focus{
  border-color:var(--sage-dark);
  box-shadow:0 0 0 3px rgba(125,139,105,.12)
}
input::placeholder{color:#A2A69A}
.item-list{
  display:flex;
  flex-direction:column;
  gap:10px
}
.item-row{
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--cream-light);
  padding:11px
}
.item-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px 36px;
  gap:8px;
  align-items:center
}
.item-name-wrap{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px
}
.emoji{
  width:25px;
  flex:0 0 25px;
  text-align:center;
  font-size:18px
}
.name-input{min-width:0}
.price-input{text-align:right}
.delete-btn,.remove-chocolate-btn{
  width:36px;
  height:38px;
  border:0;
  border-radius:8px;
  background:#F0F1ED;
  color:#8A8F82;
  cursor:pointer;
  font-size:20px;
  line-height:1
}
.delete-btn:hover,.remove-chocolate-btn:hover{
  background:#F3E8E6;
  color:var(--danger)
}
.chocolate-submenu{
  margin-top:10px;
  padding:12px;
  background:#EEF1E7;
  border:1px solid #E0E5D7;
  border-radius:10px
}
.chocolate-subtitle{
  color:var(--sage-deep);
  font-size:11px;
  font-weight:750;
  margin-bottom:9px;
  text-transform:uppercase;
  letter-spacing:.3px
}
.chocolate-entry{
  margin-bottom:10px
}
.chocolate-entry:last-of-type{margin-bottom:0}
.chocolate-fields{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px 105px 36px;
  gap:8px;
  align-items:end
}
.field-label{
  font-size:10px;
  color:var(--text-light);
  margin-bottom:4px
}
.qty-input{text-align:center}
.unit-price-input{text-align:right}
.add-chocolate-btn,.add-btn{
  width:100%;
  border:1px dashed var(--sage-dark);
  border-radius:8px;
  background:#F5F7F1;
  color:var(--sage-deep);
  cursor:pointer;
  font-weight:700
}
.add-chocolate-btn{
  margin-top:10px;
  padding:9px;
  font-size:12px
}
.add-btn{
  margin-top:10px;
  padding:11px;
  border-radius:9px;
  font-size:13px
}
.add-chocolate-btn:hover,.add-btn:hover{
  background:#EEF2E8
}
.delivery-section{margin-top:22px}
.delivery-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px;
  gap:10px;
  align-items:center
}
.delivery-row label{
  margin:0;
  font-size:13px;
  font-weight:600
}
.delivery-input{text-align:right}
.preview-box{
  width:100%;
  min-height:360px;
  padding:17px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#F4F5EF;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
  line-height:1.6
}
.total-box{
  margin-top:14px;
  padding:15px 16px;
  background:var(--sage);
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}
.total-label{
  font-size:14px;
  font-weight:650
}
.total-amount{
  font-size:20px;
  font-weight:800
}
.copy-btn{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:var(--sage-dark);
  color:#fff;
  padding:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:750
}
.copy-btn:hover{background:var(--sage-deep)}

@media(max-width:820px){
  .container{grid-template-columns:1fr}
}

@media(max-width:560px){
  .header{padding:13px 14px}
  .logo{
    width:50px;
    height:50px;
    flex-basis:50px
  }
  .brand-title{font-size:18px}
  .brand-subtitle{font-size:12px}
  .reset-btn{
    padding:13px 18px;
    min-width:96px;
    min-height:46px;
    font-size:14px
  }
  .container{
    padding:15px 11px 30px;
    gap:15px
  }
  .card{
    padding:16px;
    border-radius:14px
  }
  .card-title{
    font-size:18px;
    margin-bottom:17px
  }
  .item-main{
    grid-template-columns:minmax(0,1fr) 82px 35px;
    gap:6px
  }
  .chocolate-fields{
    grid-template-columns:minmax(0,1fr) 65px 88px 35px;
    gap:6px
  }
  .delivery-row{
    grid-template-columns:minmax(0,1fr) 90px;
    gap:8px
  }
  .delivery-row label{font-size:12px}
  .preview-box{
    min-height:300px;
    font-size:13px
  }
}

@media(max-width:380px){
  .brand-subtitle{display:none}
  .brand-title{font-size:17px}
  .reset-btn{
    padding:12px 15px;
    min-width:90px;
    min-height:44px
  }
  .item-main{
    grid-template-columns:minmax(0,1fr) 75px 34px
  }
  .chocolate-fields{
    grid-template-columns:minmax(0,1fr) 58px 78px 34px
  }
}

/* -------------------------------------------------------
   TAB NAVIGATION + GIFT IDEAS
------------------------------------------------------- */

.tab-nav{
  width:min(1120px,100%);
  margin:18px auto 0;
  padding:0 16px;
  display:flex;
  gap:12px
}
.tab-btn{
  flex:1;
  border:0;
  border-radius:12px;
  background:#E8EBE1;
  color:var(--sage-deep);
  padding:17px 12px;
  min-height:64px;
  cursor:pointer;
  font-size:19px;
  font-weight:800;
  box-shadow:var(--shadow)
}
.tab-btn.active{
  background:var(--sage-dark);
  color:#fff
}
.tab-view{display:none}
.tab-view.active{display:block}

.gift-ideas-card{
  width:min(1120px,100%);
  margin:24px auto 40px;
  padding:22px;
  background:var(--white);
  border:1px solid rgba(222,227,212,.7);
  border-radius:16px;
  box-shadow:var(--shadow)
}
.gift-selects{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.gift-select{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--cream-light);
  color:var(--text);
  padding:12px 11px;
  outline:none
}
.gift-list-box{
  margin-top:18px;
  width:100%;
  min-height:360px;
  padding:17px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#F4F5EF;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
  line-height:1.7
}
.gift-copy-btn{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:var(--sage-dark);
  color:#fff;
  padding:13px;
  cursor:pointer;
  font-size:15px;
  font-weight:750
}
.gift-copy-btn:hover{background:var(--sage-deep)}

@media(max-width:560px){
  .tab-nav{
    padding:0 11px;
    gap:8px
  }
  .tab-btn{
    min-height:60px;
    font-size:17px;
    padding:15px 8px
  }
  .gift-ideas-card{
    margin:15px auto 30px;
    padding:16px;
    border-radius:14px
  }
  .gift-selects{
    grid-template-columns:1fr
  }
  .gift-list-box{
    min-height:300px;
    font-size:13px
  }
}
</style>
</head>

function normalizeEmojiText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[_\-\/]+/g," ")
    .replace(/[^\p{L}\p{N} ]+/gu," ")
    .replace(/\s+/g," ")
    .trim();
}

function getEmoji(name){

  const value = normalizeEmojiText(name);

  if(!value) return "🎁";

  if(/\b(chocolates?|chocolate bar)\b/.test(value)) return "🍫";
  if(/\b(panda|pandas)\b/.test(value)) return "🐼";
  if(/\b(house|home|residence|dwelling|villa|cottage|bungalow)\b/.test(value)) return "🏠";
  if(/\b(flowers?|flower)\b/.test(value)) return "🌸";
  if(/\b(roses?|rose)\b/.test(value)) return "🌹";
  if(/\b(nail polish|nails?|manicure)\b/.test(value)) return "💅";
  if(/\b(wish card|greeting card|card)\b/.test(value)) return "💌";
  if(/\b(photo frame|picture frame|photograph|photo|picture)\b/.test(value)) return "🖼️";
  if(/\b(teddy bear|teddy)\b/.test(value)) return "🧸";
  if(/\b(gift box|gift|present|hamper|box)\b/.test(value)) return "🎁";

  const sortedRules = [...EMOJI_RULES]
    .sort((a,b)=>b[0].length-a[0].length);

  for(const [term,emoji] of sortedRules){
    const normalizedTerm = normalizeEmojiText(term);

    if(
      value === normalizedTerm ||
      value.includes(normalizedTerm)
    ){
      return emoji;
    }
  }

  const words = value.split(" ");

  for(const word of words){

    if(word.length < 2) continue;

    const alias = EMOJI_ALIASES[word];

    if(alias){

      if(alias.startsWith("emoji:")){
        return alias.replace("emoji:","");
      }

      const aliasNormalized = normalizeEmojiText(alias);

      for(const [term,emoji] of sortedRules){
        if(normalizeEmojiText(term) === aliasNormalized){
          return emoji;
        }
      }
    }
  }

  for(const word of words){

    if(word.length < 2) continue;

    for(const [term,emoji] of sortedRules){

      const normalizedTerm = normalizeEmojiText(term);

      if(
        normalizedTerm === word ||
        normalizedTerm.startsWith(word)
      ){
        return emoji;
      }
    }
  }

  return "🎁";
}

    item.chocolates && item.chocolates.length
      ? item.chocolates
      : [{
          brand:item.brand || "",
          qty:item.qty || 1,
          unitPrice:item.unitPrice ?? item.price ?? ""
        }];

  return `
  <div class="chocolate-submenu">

    <div class="chocolate-subtitle">

    <div class="chocolate-entries">

      ${chocolates.map(chocolate=>`

        <div class="chocolate-entry">

          <div class="chocolate-fields">

            <div>
              <div class="field-label">Brand / Type</div>
              <input
                class="brand-input"
                type="text"

                placeholder="e.g. Dairy Milk"

function removeChocolate(button){

  const submenu =
    button.closest(".chocolate-submenu");

  const entry =
    button.closest(".chocolate-entry");

  if(!submenu || !entry) return;

  const entries =
    submenu.querySelectorAll(".chocolate-entry");

  if(entries.length <= 1){

    entry.querySelector(".brand-input").value="";
    entry.querySelector(".qty-input").value=1;
    entry.querySelector(".unit-price-input").value="";

  }else{

    entry.remove();

  }

  updatePreview();
}

function itemChanged(id){

  const row =
    document.querySelector(
      `.item-row[data-id="${id}"]`
    );

  if(!row) return;

  const nameInput =
    row.querySelector(".name-input");

  const name =
    nameInput.value.trim();

  const isChocolate =
    name.toLowerCase().includes("chocolate");

  const submenu =
    row.querySelector(".chocolate-submenu");

  const main =
    row.querySelector(".item-main");

  if(isChocolate && !submenu){

    const price =
      row.querySelector(".price-input")?.value || "";

    const wrapper =
      document.createElement("div");

    wrapper.innerHTML =
      createChocolateSubmenu({
        chocolates:[
          {
            brand:"",
            qty:1,
            unitPrice:price
          }
        ]
      });

    row.appendChild(
      wrapper.firstElementChild
    );

    row.querySelector(".price-input")?.remove();
  }

  if(!isChocolate && submenu){

    const unitPrice =
      row.querySelector(
        ".unit-price-input"
      )?.value || "";

    submenu.remove();

    const priceInput =
      document.createElement("input");

    priceInput.className="price-input";
    priceInput.type="number";
    priceInput.inputMode="decimal";
    priceInput.min="0";
    priceInput.value=unitPrice;
    priceInput.placeholder="Price";

    priceInput.addEventListener(
      "input",
      updatePreview
    );

    main.insertBefore(
      priceInput,
      row.querySelector(".delete-btn")
    );
  }

  const emoji =
    row.querySelector(".emoji");

  if(emoji){
    emoji.textContent=getEmoji(name);
  }

  updatePreview();
}

function removeItem(id){

  const row =
    document.querySelector(
      `.item-row[data-id="${id}"]`
    );

  if(row) row.remove();

  updatePreview();
}

/* -------------------------------------------------------
   READ ITEMS
------------------------------------------------------- */

function getItems(){

  const rows =
    document.querySelectorAll(".item-row");

  const items=[];

  rows.forEach(row=>{

    const nameInput =
      row.querySelector(".name-input");

    if(!nameInput) return;

    const name =
      nameInput.value.trim();

    if(!name) return;

    const submenu =
      row.querySelector(".chocolate-submenu");

    if(submenu){

      submenu
        .querySelectorAll(".chocolate-entry")
        .forEach(entry=>{

          const brand =
            entry
              .querySelector(".brand-input")
              ?.value.trim() || "";

          const qtyValue =
            Number(
              entry.querySelector(".qty-input")?.value
            );

          const qty =
            qtyValue > 0 ? qtyValue : 1;

          const rawUnitPrice =
            entry
              .querySelector(".unit-price-input")
              ?.value || "";

          const hasPrice =
            String(rawUnitPrice).trim() !== "" &&
            Number(rawUnitPrice) > 0;

          const unitPrice =
            hasPrice ? Number(rawUnitPrice) : 0;

          items.push({
            name,
            chocolate:true,
            brand,
            qty,
            unitPrice,
            total:qty * unitPrice,
            pricePending:!hasPrice
          });

        });

    }else{

      const rawPrice =
        row.querySelector(".price-input")?.value || "";

      const hasPrice =
        String(rawPrice).trim() !== "" &&
        Number(rawPrice) > 0;

      const price =
        hasPrice ? Number(rawPrice) : 0;

      items.push({
        name,
        chocolate:false,
        price,
        total:price,
        pricePending:!hasPrice
      });

    }

  });

  return items;
}

   CUSTOMER PREVIEW
------------------------------------------------------- */

function updatePreview(){

  const hamperName =
    document
      .getElementById("hamperName")
      .value.trim() ||
    "Gift Hamper";

  const items=getItems();

  let giftItemsTotal=0;

  let message =
    `🎁 *${hamperName}*\n\n`;

  message += `*Gift Items*\n`;

  if(items.length===0){

    message += `No items added\n`;

  }else{

    items.forEach(item=>{

      giftItemsTotal += item.total;

      if(item.chocolate){

        let line=`🍫`;

        if(item.brand){
          line += ` ${item.brand}`;
        }

        if(item.pricePending){

          line +=
            ` × ${item.qty} — Pending`;

          message += `*${line}*\n`;

        }else{

          line +=
            ` × ${item.qty} — ₹${formatMoney(item.total)}`;

          message += line + "\n";

        }

      }else{

        if(item.pricePending){

          const line =
            `${getEmoji(item.name)} ` +
            `${item.name} — Pending`;

          message += `*${line}*\n`;

        }else{

          message +=
            `${getEmoji(item.name)} ` +
            `${item.name} — ₹${formatMoney(item.total)}\n`;

        }

      }

    });

  }

  message +=
    `\n*Gift Items Total — ₹${formatMoney(giftItemsTotal)}*\n\n`;

  message +=
    `✨ *Gift Preparation*\n`;

  PREPARATION_CHARGES.forEach(charge=>{

    message +=
      `${charge.emoji} ${charge.name} — ₹${formatMoney(charge.amount)}\n`;

  });

  message +=
    `\n🧰 Gift Preparation Total — ₹${formatMoney(FIXED_PREPARATION_TOTAL)}\n`;

  const delivery =
    Number(
      document.getElementById("delivery").value
    ) || 0;

  message +=
    `🚚 Doorstep Delivery — ₹${formatMoney(delivery)}\n`;

  const total =
    giftItemsTotal +
    FIXED_PREPARATION_TOTAL +
    delivery;

  message +=
    `\n━━━━━━━━━━━━━━━━\n`;

  message +=
    `💰 *TOTAL — ₹${formatMoney(total)}*`;

  document.getElementById("preview")
    .textContent=message;

  document.getElementById("totalAmount")
    .textContent=`₹${formatMoney(total)}`;
}

async function copyPreview(){

  const text =
    document
      .getElementById("preview")
      .textContent;

  try{

    await navigator.clipboard.writeText(text);

  }catch(error){

    const temp =
      document.createElement("textarea");

    temp.value=text;
    temp.style.position="fixed";
    temp.style.opacity="0";

    document.body.appendChild(temp);

    temp.select();

    document.execCommand("copy");

    temp.remove();
  }

  const button =
    document.querySelector(".copy-btn");

  const original =
    button.textContent;

  button.textContent="✓ Copied!";

  setTimeout(
    ()=>button.textContent=original,
    1500
  );
}

    !showPrice
  );

  priceTab.classList.toggle(
    "active",
    showPrice
  );

  giftTab.classList.toggle(
    "active",
    !showPrice
  );
}

function updateGiftRecipientOptions(){

  const occasion =
    document.getElementById("giftOccasion").value;

  const recipient =
    document.getElementById("giftRecipient");

  const previous =
    recipient.value;

  if(occasion === "wedding"){

    recipient.innerHTML=`
      <option value="him">👨 Him</option>
      <option value="her">👩 Her</option>
    `;

  }else{

    recipient.innerHTML=`
      <option value="him">👨 Him</option>
      <option value="her">👩 Her</option>
      <option value="boy">👦 Boy</option>
      <option value="girl">👧 Girl</option>
    `;

  }

  if(
    [...recipient.options]
      .some(option=>option.value===previous)
  ){

    recipient.value=previous;

  }

  updateGiftIdeas();
}

function updateGiftIdeas(){

  const occasion =
    document.getElementById("giftOccasion").value;

  const recipient =
    document.getElementById("giftRecipient").value;

  const recipientLabel =
    recipient === "him"
      ? "Him"
      : recipient === "her"
        ? "Her"
        : recipient === "boy"
          ? "Boy"
          : "Girl";

  const occasionLabel =
    occasion === "wedding"
      ? "Wedding Anniversary"
      : "Birthday";

  const ideas =
    (GIFT_IDEAS[occasion] &&
     GIFT_IDEAS[occasion][recipient])
      || [];

  let message =
    `🎁 *${occasionLabel} Gift Ideas – For ${recipientLabel}*\n\n`;

  message +=
    ideas
      .map(item=>`${getGiftEmoji(item, recipient)} ${item}`)
      .join("\n");

  document.getElementById("giftList")
    .textContent=message;
}

async function copyGiftIdeas(){

  const text =
    document
      .getElementById("giftList")
      .textContent;

  try{

    await navigator.clipboard.writeText(text);

  }catch(error){

    const temp =
      document.createElement("textarea");

    temp.value=text;
    temp.style.position="fixed";
    temp.style.opacity="0";

    document.body.appendChild(temp);

    temp.select();

    document.execCommand("copy");

    temp.remove();

  }

  const button =
    document.getElementById("giftCopyBtn");

  const original =
    button.textContent;

  button.textContent="✓ Copied!";

  setTimeout(
    ()=>button.textContent=original,
    1500
  );
}
